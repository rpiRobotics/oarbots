Section "ServerLayout"
    Identifier "HeadlessLayout"
    Screen 2 "Screen2"
EndSection

Section "Module"
    Load "glx"
EndSection

Section "Device"
    Identifier "NvidiaDevice"
    Driver "nvidia"
    
    # Set this to your GPU's PCI BusID. Find it with:
    #   nvidia-xconfig --query-gpu-info
    # then format as "PCI:<bus>:<device>:<function>", e.g. "PCI:1:0:0"
    BusID "PCI:1:0:0"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "UseDisplayDevice" "none"
    Option "HardDPMS" "false"
EndSection

Section "Monitor"
    Identifier "NvidiaMonitor"
    HorizSync 30-80
    VertRefresh 50-75
    Option "Ignore" "true"
EndSection

Section "Screen"
    Identifier "Screen2"
    Device "NvidiaDevice"
    Monitor "NvidiaMonitor"
    DefaultDepth 24

    SubSection "Display"
        Depth 24
        Virtual 1280 800
    EndSubSection
EndSection