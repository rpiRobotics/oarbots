# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    joints:
      - oarbot_silver/j2n6s300_joint_1
      - oarbot_silver/j2n6s300_joint_2
      - oarbot_silver/j2n6s300_joint_3
      - oarbot_silver/j2n6s300_joint_4
      - oarbot_silver/j2n6s300_joint_5
      - oarbot_silver/j2n6s300_joint_6
  gripper_controller:
    action_ns: gripper_command
    type: GripperCommand
    joints:
      - oarbot_silver/j2n6s300_joint_finger_1
      - oarbot_silver/j2n6s300_joint_finger_tip_1
      - oarbot_silver/j2n6s300_joint_finger_2
      - oarbot_silver/j2n6s300_joint_finger_tip_2
      - oarbot_silver/j2n6s300_joint_finger_3
      - oarbot_silver/j2n6s300_joint_finger_tip_3